# Tests del gateway: sin registro ni cliente de descubrimiento Eureka.
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false
spring.cloud.service-registry.auto-registration.enabled=false

# Al desactivar el discovery client, hay que desactivar tambien el locator
# por descubrimiento del gateway; si no, intenta inyectar un ReactiveDiscoveryClient
# inexistente y el contexto no arranca. Las rutas estaticas (lb://) se siguen cargando.
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false
